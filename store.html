<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>//marketech - Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Navbar principal -->
    <nav class="navbar navbar-expand-lg navbar-light bg-celeste sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold fs-5" href="#">TechStore</a>
            <div class="d-flex align-items-center gap-2">
                <span id="saludo-usuario" class="text-white fw-semibold d-none d-md-inline"></span>
                <button id="btn-toggle-carrito" class="btn btn-light btn-sm fw-bold text-primary">
                    Carrito (<span id="contador-carrito">0</span>)
                </button>
                <button id="btn-cerrar-sesion" class="btn btn-outline-light btn-sm">Salir</button>
            </div>
        </div>
    </nav>

    <!-- Barra secundaria con buscador y filtros -->
    <div class="bg-white border-bottom py-2 shadow-sm mb-4">
        <div class="container-fluid px-4">
            <div class="row g-2 align-items-center">
                <!-- Buscador -->
                <div class="col-12 col-md-4">
                    <input type="search" id="buscador" class="form-control rounded-pill" placeholder="Buscar productos...">
                </div>
                <!-- Filtros por categoría -->
                <div class="col-12 col-md-8">
                    <div id="filtros-categoria" class="d-flex flex-wrap gap-2">
                        <button class="btn btn-primary rounded-pill btn-sm px-3 category-btn" data-categoria="Todos">Todos</button>
                        <button class="btn btn-outline-secondary rounded-pill btn-sm px-3 category-btn" data-categoria="Monitores">Monitores</button>
                        <button class="btn btn-outline-secondary rounded-pill btn-sm px-3 category-btn" data-categoria="Periféricos">Periféricos</button>
                        <button class="btn btn-outline-secondary rounded-pill btn-sm px-3 category-btn" data-categoria="Sillas Gamer">Sillas Gamer</button>
                        <button class="btn btn-outline-secondary rounded-pill btn-sm px-3 category-btn" data-categoria="Audio y Video">Audio y Video</button>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <main class="container my-5 flex-grow-1">
        <h2 class="text-center mb-5 fw-bold" style="color: var(--celeste-oscuro);">Catálogo de Productos</h2>
        <div id="grid-productos" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            </div>
    </main>

    <div id="panel-carrito" class="carrito-panel">
        <div class="carrito-header d-flex justify-content-between align-items-center">
            <h4 class="m-0" style="color: var(--celeste-oscuro);">Mi Compra</h4>
            <button id="btn-cerrar-carrito" class="btn-close"></button>
        </div>
        <div class="carrito-body">
            <ul id="lista-carrito" class="list-group list-group-flush"></ul>
        </div>
        <div class="carrito-footer">
            <h5 class="d-flex justify-content-between">Total: <span>$<span id="total-carrito">0.00</span></span></h5>
            <button id="btn-procesar-compra" class="btn-principal w-100 mt-3">Finalizar Compra</button>
            <button id="btn-vaciar-carrito" class="btn btn-outline-danger w-100 mt-2">Vaciar Carrito</button>
        </div>
    </div>

    <div id="toast-container" class="toast-notificacion"></div>

    <!-- Footer -->
    <footer class="footer mt-auto">
        <p>Proyecto Final - <strong>TechStore</strong></p>
        <p>Desarrollado por <strong>Nahuel Carrera</strong>.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>//marketech - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-inicio">
    <!-- Navbar principal -->
    <nav class="navbar navbar-expand-lg navbar-light bg-celeste shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-5" href="#">TechStore</a>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="tarjeta-caja auth-container text-center">
            <h2 class="mb-4" style="color: var(--celeste-oscuro);">Bienvenido</h2>
            
            <div id="vista-login">
                <input type="email" id="log-email" class="form-control mb-3" placeholder="Correo electrónico" required>
                <input type="password" id="log-pass" class="form-control mb-3" placeholder="Contraseña" required>
                <button id="btn-login" class="btn-principal w-100">Ingresar</button>
                <p class="mt-3 mb-0">¿No tienes cuenta? <a href="#" class="btn-alternar" style="color: var(--celeste-oscuro);">Regístrate</a></p>
            </div>

            <div id="vista-registro" class="d-none">
                <input type="text" id="reg-nombre" class="form-control mb-3" placeholder="Nombre completo" required>
                <input type="email" id="reg-email" class="form-control mb-3" placeholder="Correo electrónico" required>
                <input type="password" id="reg-pass" class="form-control mb-3" placeholder="Contraseña" required>
                <button id="btn-registro" class="btn-principal w-100">Crear Cuenta</button>
                <p class="mt-3 mb-0">¿Ya tienes cuenta? <a href="#" class="btn-alternar" style="color: var(--celeste-oscuro);">Inicia sesión</a></p>
            </div>
            
            <div id="mensaje-auth" class="mt-3 text-danger fw-bold"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto">
        <p>Proyecto Final - <strong>TechStore</strong></p>
        <p>Desarrollado por <strong>Nahuel Carrera</strong>.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
